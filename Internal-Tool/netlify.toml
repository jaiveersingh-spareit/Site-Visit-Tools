[build]
  command = "echo 'No build step needed - single page app'"
  publish = "."
  functions = "netlify/functions"

# Environment variables (SENDGRID_API_KEY, OPERATIONS_EMAIL) are set in the
# Netlify dashboard only. Do NOT declare them here: a value set in this file
# overrides the dashboard, and an empty string silently breaks email export.

[[redirects]]
  from = "/*"
  to = "/INTERNAL_Site_Visit_Tool_v3.html"
  status = 200
